# Foundry fuzz suite for AegisJIT math (Hardhat remains the main build/test toolchain).
[profile.default]
src = "test/foundry"
test = "test/foundry"
out = "out-forge"
cache_path = "cache-forge"
libs = ["node_modules"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@1inch/=node_modules/@1inch/",
  "@openzeppelin/=node_modules/@openzeppelin/",
  "forge-std/=node_modules/forge-std/src/",
]

[fuzz]
runs = 5000
