  </defs>
  <rect width="1024" height="1024" rx="190" fill="url(#bg)"/>
  <defs>
    <clipPath id="shield"><path d="M512 180 L794 266 C808 522 726 728 512 858 C298 728 216 522 230 266 Z"/></clipPath>
    <linearGradient id="g2a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/></linearGradient>
