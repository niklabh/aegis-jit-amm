# Hosted dashboard: Cloudflare Worker (ui/worker/index.ts) + the Vite build (ui/dist) as static assets.
# Lives at the repo root so that any wrangler command, run from the root or from ui/, targets this Worker.
#   npm --prefix ui run deploy                            # vite build -> wrangler deploy
#   wrangler secret put PRODUCTION_WORLD_ID_RP_ID          # relying-party id of the developer.world.org app
#   wrangler secret put PRODUCTION_WORLD_ID_RP_SIGNING_KEY # its signing key; stays in Cloudflare, never in the bundle
name = "aegis-jit"
main = "ui/worker/index.ts"
compatibility_date = "2026-01-01"

[assets]
directory = "./ui/dist"
binding = "ASSETS"
run_worker_first = ["/health", "/worldid/*"]

[vars]
PRODUCTION_WORLD_ID_APP_ID = "app_388962c8b7d2d26b09dccda085144d58"
